name: Setup Rust for Tauri
description: Nightly Rust (matches src-tauri/rust-toolchain.toml) + rust-cache for desktop builds.

inputs:
  cache-key:
    description: Suffix for rust-cache shared-key (e.g. macOS-aarch64, Windows, or ci-ubuntu).
    required: true
  targets:
    description: Comma-separated rustup targets to install (macOS cross-builds).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly
        components: rustfmt, clippy
        targets: ${{ inputs.targets }}

    - name: Rust cache
      uses: swatinem/rust-cache@v2
      with:
        workspaces: src-tauri
        # Separate caches per OS/job so macOS publish does not thrash Ubuntu CI.
        shared-key: sift-${{ inputs.cache-key }}
        cache-workspace-crates: true
        cache-all-crates: true
        cache-on-failure: true
