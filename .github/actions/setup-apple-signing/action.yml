name: Setup Apple code signing
description: Import Developer ID .p12 and App Store Connect API key when secrets are present.

outputs:
  signing_enabled:
    description: true when certificate secrets were imported
    value: ${{ steps.import.outputs.signing_enabled }}

runs:
  using: composite
  steps:
    - name: Import signing certificate
      id: import
      shell: bash
      env:
        APPLE_CERTIFICATE: ${{ env.APPLE_CERTIFICATE }}
        APPLE_CERTIFICATE_PASSWORD: ${{ env.APPLE_CERTIFICATE_PASSWORD }}
        KEYCHAIN_PASSWORD: ${{ env.KEYCHAIN_PASSWORD }}
        APPLE_API_KEY: ${{ env.APPLE_API_KEY }}
        APPLE_API_KEY_CONTENT: ${{ env.APPLE_API_KEY_CONTENT }}
      run: |
        set -euo pipefail
        if [ -z "${APPLE_CERTIFICATE:-}" ]; then
          echo "Apple signing secrets not set; building unsigned macOS bundle."
          echo "signing_enabled=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ] || [ -z "${KEYCHAIN_PASSWORD:-}" ]; then
          echo "error: APPLE_CERTIFICATE set but password secrets are missing" >&2
          exit 1
        fi
        echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
        security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        security set-keychain-settings -t 3600 -u build.keychain
        security import "$RUNNER_TEMP/certificate.p12" -k build.keychain \
          -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
          -k "$KEYCHAIN_PASSWORD" build.keychain
        security find-identity -v -p codesigning build.keychain

        if [ -n "${APPLE_API_KEY:-}" ] && [ -n "${APPLE_API_KEY_CONTENT:-}" ]; then
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
        else
          echo "note: notarization API key not set; signed but not notarized"
        fi
        echo "signing_enabled=true" >> "$GITHUB_OUTPUT"
