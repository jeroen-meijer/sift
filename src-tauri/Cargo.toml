[package]
name = "sift"
version = "0.1.0"
description = "Local sample manager for producers"
authors = ["Jeroen Meijer"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "sift_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio = { version = "1.53.1", features = ["full"] }
thiserror = "2.0.20"
anyhow = "1.0.104"
uuid = { version = "1.20.0", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
directories = "6.0.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
