[package]
name = "sift"
version = "0.1.0"
description = "Local sample manager for producers"
authors = ["Jeroen Meijer"]
edition = "2024"
license = "MIT"
readme = "../README.md"
repository = "https://github.com/jeroen-meijer/sift"

[lib]
name = "sift_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["full"] }
thiserror = "2.0.20"
anyhow = "1.0.104"
uuid = { version = "1.20.0", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
directories = "6.0.0"
tauri-plugin-dialog = "2.7.3"
walkdir = "2.5.0"
globset = "0.4.19"
symphonia = { version = "0.6.1", features = ["all"] }
cpal = "0.18.2"
hound = "3.5.1"
rtrb = "0.4.0"
tauri-plugin-drag = "2"
drag = "2.1.1"
stratum-dsp = "1.0.0"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
diesel = { version = "2.2.12", features = ["sqlite", "returning_clauses_for_sqlite_3_35", "chrono"] }
diesel_migrations = { version = "2.2.0", features = ["sqlite"] }
libsqlite3-sys = { version = "0.38.2", features = ["bundled"] }

# macOS only: used to check AppKit still has a live mouse event before handing a
# drag to the plugin, which aborts the process on a NULL drag session.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSEvent", "NSResponder"] }

[dev-dependencies]
criterion = "0.8"
tempfile = "3"

[[bench]]
name = "audio_hotpath"
harness = false

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# https://www.namtao.com/rust-toolkit-2026/ (same deny set as chat-search)
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# App crate: Tauri lib is not a published public API.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Tauri `#[tauri::command]` handlers must take owned IPC args.
needless_pass_by_value = "allow"
# Large orchestrators (watch loop, analyze batch) stay cohesive; prefer
# extracting helpers when practical, but do not force 100-line splits.
too_many_lines = "allow"
# Diesel Integer (i32) ↔ IPC/JS (i64) and audio sizes: use `crate::ids` helpers.
as_conversions = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
