# https://dystroy.org/bacon/
default_job = "clippy"

[jobs.clippy]
command = ["cargo", "clippy", "--all-targets", "--all-features", "--", "-D", "warnings"]
need_stdout = false
watch = ["clippy.toml"]

[jobs.fmt]
command = ["cargo", "fmt", "--all", "--", "--check"]
need_stdout = true

[jobs.test]
command = ["cargo", "nextest", "run", "--all-features", "--no-tests=pass"]
need_stdout = true

[jobs.check]
command = ["cargo", "check", "--all-targets", "--all-features"]
need_stdout = false

[jobs.bench]
command = ["cargo", "bench", "--bench", "audio_hotpath", "--", "--warm-up-time", "1", "--measurement-time", "2"]
need_stdout = true
watch = ["benches"]
